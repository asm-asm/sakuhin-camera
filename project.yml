# XcodeGen の定義。.xcodeproj は生成物なのでコミットしない（`xcodegen generate` で作る）。
name: SakuhinCamera
options:
  bundleIdPrefix: com.sammy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8R9WYLJ73B
    CODE_SIGN_STYLE: Automatic
targets:
  SakuhinCamera:
    type: application
    platform: iOS
    sources:
      - App
      # 背景素材（画像と manifest.json）をフォルダごと同梱する
      - path: Backgrounds
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 作品カメラ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 作品を撮影するためにカメラを使用します
        NSPhotoLibraryAddUsageDescription: 加工した写真を保存するために使用します
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.sakuhincamera
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SakuhinCameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SakuhinCamera
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sammy.sakuhincamera.tests
schemes:
  SakuhinCamera:
    build:
      targets:
        SakuhinCamera: all
    test:
      targets:
        - SakuhinCameraTests
