# シミュレータでアプリを起動して画面のスクリーンショットを撮る（ライト・ダーク）。
# 結果は Actions の Artifacts「screenshots」からダウンロードできる。
name: Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project SakuhinCamera.xcodeproj \
            -scheme SakuhinCamera \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Take screenshots
        run: |
          mkdir -p shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SakuhinCamera.app
          xcrun simctl privacy "$UDID" grant camera com.sammy.sakuhincamera || true
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl launch "$UDID" com.sammy.sakuhincamera -showPaywall -paywallDemo
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/paywall_$mode.png"
            xcrun simctl terminate "$UDID" com.sammy.sakuhincamera || true
            xcrun simctl launch "$UDID" com.sammy.sakuhincamera -showPaywall -paywallDemo -paywallScrollToPlans
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/paywall_plans_$mode.png"
            xcrun simctl terminate "$UDID" com.sammy.sakuhincamera || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots

  # App Store 用：本物の写真（ScreenshotAssets）を、アプリと同じ Vision で切り抜いて各画面を撮る（iPhone 6.9インチ）。
  store:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make mask with Vision (macOS)
        run: |
          mkdir -p demo
          swift scripts/make-mask.swift ScreenshotAssets/demo_photo.jpg demo
          cp ScreenshotAssets/demo_photo.jpg demo/

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone 6.9-inch simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if "iOS" in r), reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if "Pro Max" in d["name"]))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcodebuild build \
            -project SakuhinCamera.xcodeproj \
            -scheme SakuhinCamera \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Take store screenshots
        run: |
          mkdir -p store
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SakuhinCamera.app
          xcrun simctl privacy "$UDID" grant camera com.sammy.sakuhincamera || true
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularMode active --cellularBars 4
          DATA=$(xcrun simctl get_app_container "$UDID" com.sammy.sakuhincamera data)
          mkdir -p "$DATA/Documents"
          cp demo/demo_photo.jpg demo/demo_mask.raw demo/demo_labels.raw "$DATA/Documents/"
          shoot() {
            name="$1"; shift
            xcrun simctl launch "$UDID" com.sammy.sakuhincamera "$@"
            sleep 12
            xcrun simctl io "$UDID" screenshot "store/$name.png"
            xcrun simctl terminate "$UDID" com.sammy.sakuhincamera || true
          }
          shoot 1_preview -demoScene preview -demoPremium
          shoot 2_cutout -demoScene cutout -demoPremium
          shoot 3_background -demoScene background -demoPremium -demoBackground plant_01
          shoot 4_export -demoScene export -demoPremium -demoBackground plant_01
          cp demo/demo_mask.png store/

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: store
