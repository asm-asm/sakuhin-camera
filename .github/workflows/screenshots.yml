# シミュレータでアプリを起動して画面のスクリーンショットを撮る（ライト・ダーク）。
# 結果は Actions の Artifacts「screenshots」からダウンロードできる。
name: Screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime
                     for d in ds if d["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build \
            -project SakuhinCamera.xcodeproj \
            -scheme SakuhinCamera \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Take screenshots
        run: |
          mkdir -p shots
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/SakuhinCamera.app
          xcrun simctl privacy "$UDID" grant camera com.sammy.sakuhincamera || true
          for mode in light dark; do
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl launch "$UDID" com.sammy.sakuhincamera -showPaywall -paywallDemo
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/paywall_$mode.png"
            xcrun simctl terminate "$UDID" com.sammy.sakuhincamera || true
            xcrun simctl launch "$UDID" com.sammy.sakuhincamera -showPaywall -paywallDemo -paywallScrollToPlans
            sleep 8
            xcrun simctl io "$UDID" screenshot "shots/paywall_plans_$mode.png"
            xcrun simctl terminate "$UDID" com.sammy.sakuhincamera || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
